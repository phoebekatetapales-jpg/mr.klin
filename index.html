<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MR. Klin Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png" />
<link rel="apple-touch-icon" href="images/icon-180.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="min-h-screen bg-canvas font-sans text-ink antialiased transition-colors duration-200">
<script src="js/theme-init.js"></script>

  <div id="login-root"></div>

  <div id="app-root" class="hidden">
    <div id="sidebar-overlay" onclick="closeMobileSidebar()" class="fixed inset-0 z-30 hidden bg-black/60 backdrop-blur-sm lg:hidden"></div>
    <div class="flex min-h-screen">
      <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col bg-panel shadow-2xl shadow-black/30 transition-all duration-200 ease-in-out lg:z-30 lg:h-screen lg:w-64 lg:translate-x-0 lg:border-r lg:border-line/10 lg:shadow-none"></aside>

      <div id="main-column" class="flex min-w-0 flex-1 flex-col transition-[padding] duration-200 ease-in-out lg:pl-64">
        <header class="sticky top-0 z-20 border-b border-line/10 bg-panel/95 backdrop-blur">
          <div class="mx-auto flex max-w-7xl flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
            <div class="flex min-w-0 items-start gap-3">
              <button onclick="openMobileSidebar()" aria-label="Open menu" class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-line/10 bg-line/5 text-ink transition-colors hover:border-line/20 hover:bg-line/10 lg:hidden">
                <i data-lucide="menu" class="h-[18px] w-[18px]"></i>
              </button>
              <div id="page-header-text"></div>
            </div>
            <div class="flex shrink-0 items-center gap-2 self-start sm:self-center">
              <div id="header-date" class="mr-2 hidden items-center gap-1.5 text-xs font-medium text-muted xl:flex"></div>
              <div id="notif-overlay" onclick="closeNotifications()" class="fixed inset-0 z-30 hidden"></div>
              <div class="relative">
                <button id="notif-toggle" onclick="toggleNotifications()" aria-label="Notifications" class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-line/10 bg-line/5 text-ink transition-colors hover:border-line/20 hover:bg-line/10">
                  <i data-lucide="bell" class="h-4 w-4"></i>
                  <span id="notif-count" class="absolute -right-1 -top-1 hidden min-w-[18px] rounded-full bg-brand-red px-1 text-center text-[10px] font-semibold leading-[18px] text-white"></span>
                </button>
                <div id="notif-panel" class="absolute right-0 top-full z-40 mt-2 hidden w-80 max-w-[90vw] overflow-hidden rounded-xl border border-line/10 bg-panel shadow-2xl shadow-black/30"></div>
              </div>
              <button id="theme-toggle" onclick="toggleTheme()" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-line/10 bg-line/5 text-ink transition-colors hover:border-line/20 hover:bg-line/10"></button>
              <div id="user-badge" class="inline-flex shrink-0 items-center gap-2 rounded-full border border-line/10 bg-line/5 px-3 py-1.5"></div>
            </div>
          </div>
          <div class="racing-stripe absolute inset-x-0 bottom-0"></div>
        </header>

        <main class="mx-auto w-full max-w-7xl flex-1 px-4 pb-24 pt-6 sm:px-6 lg:px-8">
          <div id="section-root" class="space-y-6"></div>
        </main>

        <div id="modal-root"></div>
        <div id="booking-modal-root"></div>
      </div>
    </div>
  </div>

<script src="js/dashboard.js"></script>
</body>
</html>
