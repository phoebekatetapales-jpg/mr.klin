<style>
  .tabular-nums { font-variant-numeric: tabular-nums; }
  body { font-feature-settings: "cv11", "ss01"; letter-spacing: -0.006em; }
  .font-heading { letter-spacing: 0.01em; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--color-line) / 0.12); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  :root:not([data-theme="light"]) input[type="date"] { color-scheme: dark; }
  /* Brand amber is too light to read as text on white, so light mode
     swaps in a deeper shade for text/borders only (fills keep the brand tone). */
  :root[data-theme="light"] .text-brand-amber { color: #A8650A; }
  :root[data-theme="light"] .border-brand-amber\/40 { border-color: rgb(168 101 10 / 0.35); }
  /* Logo tile: black in dark mode, white in light mode (logo.png is transparent) */
  .brand-logo { display: block; object-fit: contain; background: #0B0D10; border: 1px solid rgba(255,255,255,.08); }
  :root[data-theme="light"] .brand-logo { background: #FFFFFF; border-color: rgb(0 0 0 / 0.1); }
  ::selection { background: #E63946; color: #F5F5F3; }

  /* Dark is the default brand look; light overrides the same tokens so
     every bg-canvas/panel/ink/muted/line/ class repaints without touching
     markup. `line` stands in for the raw white/NN overlays borders and
     hover states used before light mode existed — white-based in dark
     mode (unchanged), black-based in light mode. Named "canvas" (not
     "base") to avoid colliding with Tailwind's built-in text-base
     font-size utility. */
  :root {
    --color-canvas: 12 13 15;
    --color-panel: 21 22 25;
    --color-ink: 237 238 240;
    --color-muted: 145 149 157;
    --color-line: 255 255 255;
  }
  :root[data-theme="light"] {
    --color-canvas: 246 247 249;
    --color-panel: 255 255 255;
    --color-ink: 17 19 23;
    --color-muted: 100 106 118;
    --color-line: 0 0 0;
  }

  /* ---------------------------------------------------------------------
     Automotive instrument-cluster styling
     --------------------------------------------------------------------- */
  .font-display { letter-spacing: 0.03em; }
  /* Carbon-fibre weave + a faint red ambient glow behind the dark theme */
  :root:not([data-theme="light"]) body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgb(230 57 70 / 0.07), transparent 70%),
      repeating-linear-gradient(45deg, rgb(255 255 255 / 0.016) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(-45deg, rgb(0 0 0 / 0.22) 0 2px, transparent 2px 4px);
    background-attachment: fixed;
  }
  /* Brushed-bezel top highlight on every dark panel */
  :root:not([data-theme="light"]) .bg-panel {
    background-image: linear-gradient(180deg, rgb(255 255 255 / 0.04), rgb(255 255 255 / 0) 45%);
  }
  .racing-stripe {
    height: 2px;
    background: linear-gradient(90deg, transparent, #E63946 15%, #E63946 60%, #F2A93B 75%, transparent);
    opacity: 0.8;
  }
  .glow-red { text-shadow: 0 0 14px rgb(230 57 70 / 0.65); }
  .glow-amber { text-shadow: 0 0 14px rgb(242 169 59 / 0.55); }
  .led-red { box-shadow: 0 0 10px rgb(230 57 70 / 0.7); }
  /* Segmented LED look for bar fills */
  .seg-h {
    -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 7px, transparent 7px 9px);
            mask-image: repeating-linear-gradient(90deg, #000 0 7px, transparent 7px 9px);
  }
  .seg-v {
    -webkit-mask-image: repeating-linear-gradient(0deg, #000 0 6px, transparent 6px 8px);
            mask-image: repeating-linear-gradient(0deg, #000 0 6px, transparent 6px 8px);
  }

  /* The cluster stays dark in both themes, like a real dash at night. */
  .cluster {
    color: #EDEEF0;
    background: radial-gradient(ellipse 70% 90% at 50% 0%, #22252b 0%, #101114 60%, #0a0b0d 100%);
    border: 1px solid rgb(255 255 255 / 0.08);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / 0.07),
      inset 0 -30px 60px rgb(0 0 0 / 0.55),
      0 24px 48px -24px rgb(0 0 0 / 0.65);
  }
  .cluster .c-muted { color: #8D929B; }
  .cluster .c-line { border-color: rgb(255 255 255 / 0.08); }
  .gauge-needle {
    transform-box: view-box;
    transform-origin: 100px 100px;
    transform: rotate(var(--deg));
    animation: needle-move 1.1s cubic-bezier(0.22, 0.9, 0.25, 1) both;
  }
  .gauge-needle.boot { animation: needle-boot 1.8s cubic-bezier(0.45, 0, 0.25, 1) both; }
  @keyframes needle-move { from { transform: rotate(var(--from)); } to { transform: rotate(var(--deg)); } }
  @keyframes needle-boot {
    0% { transform: rotate(-120deg); }
    45% { transform: rotate(120deg); }
    100% { transform: rotate(var(--deg)); }
  }
  .gauge-arc { stroke-dasharray: var(--pct) 100; animation: arc-move 1.1s cubic-bezier(0.22, 0.9, 0.25, 1) both; }
  @keyframes arc-move { from { stroke-dasharray: var(--from-pct) 100; } to { stroke-dasharray: var(--pct) 100; } }
  .telltale { opacity: 0.22; transition: opacity 0.2s, transform 0.2s; }
  .telltale.on { opacity: 1; color: var(--tt); }
  .telltale.on svg { filter: drop-shadow(0 0 6px var(--tt)); }
  .telltale.on:hover { transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) {
    .gauge-needle, .gauge-needle.boot, .gauge-arc { animation: none; }
  }
</style>

<script>
  // Applied before the app renders so login/app don't flash the wrong
  // theme; the main script re-reads this same attribute at startup.
  (function () {
    try {
      var saved = localStorage.getItem("mrklin_theme_v1");
      var theme = saved || ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {}
  })();
</script>

// "₱2,250" or "from ₱1,500 + quote for …" -> half of the first peso amount
function downpaymentFromEstimate(estimate) {
  const m = /₱\s?([\d,]+(?:\.\d+)?)/.exec(String(estimate || ""));
  if (!m) return 0;
  return Math.ceil(Number(m[1].replace(/,/g, "")) / 2);
}

// Bookings made on the public website are stored online (see api/bookings.js)
// so every device sees them. They're merged with this browser's walk-ins.
const BOOKINGS_API = "/api/bookings";
const BOOKINGS_POLL_MS = 60000;
const ONLINE_STATUSES = ["Booked", "Confirmed", "In progress", "Completed", "Cancelled"];
let onlineBookings = [];
let onlineBookingsSnapshot = "";

function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
// Shape a website booking like a walk-in record; every field is escaped
// because it was typed by a member of the public and is rendered as HTML.
function toDashboardBooking(raw) {
  const services = (raw.services || []).join(", ");
  const vehicle = raw.vehicle || raw.vehicleType || "";
  return {
    id: escapeHtml(raw.id),
    source: "website",
    title: escapeHtml(`Website booking — ${services}`),
    sub: escapeHtml(`${vehicle}${raw.plate ? " · Plate " + raw.plate : ""} · Owner: ${raw.ownerName}${raw.email ? " (" + raw.email + ")" : ""} · ${formatDateKey(raw.date)} ${raw.slot}${raw.location && raw.location !== "At the shop" ? " · " + raw.location : ""}${raw.notes ? " · " + raw.notes : ""}`),
    status: ONLINE_STATUSES.includes(raw.status) ? raw.status : "Booked",
    time: escapeHtml(`${raw.slot} · Website`),
    date: /^\d{4}-\d{2}-\d{2}$/.test(raw.date) ? raw.date : todayKey(),
    ownerName: escapeHtml(raw.ownerName),
    phone: escapeHtml(raw.phone),
    email: escapeHtml(raw.email),
    vehicle: escapeHtml(vehicle),
    plate: escapeHtml(raw.plate),
    service: escapeHtml(services),
    estimate: escapeHtml(raw.estimate),
    notes: escapeHtml(raw.notes),
    location: escapeHtml(raw.location),
    photoCount: Math.max(0, Math.min(3, Number(raw.photoCount) || 0)),
    payment: PAYMENT_STATES.includes(raw.payment) ? raw.payment : "Unpaid",
    downpayment: downpaymentFromEstimate(raw.estimate),
    estimateFrom: /^\s*from\b/i.test(raw.estimate || "") || /quote/i.test(raw.estimate || ""),
  };
}
async function fetchOnlineBookings() {
  try {
    const res = await fetch(BOOKINGS_API, { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    const snapshot = JSON.stringify(data.bookings || []);
    if (snapshot === onlineBookingsSnapshot) return;
    onlineBookingsSnapshot = snapshot;
    onlineBookings = (data.bookings || []).map(toDashboardBooking);
    if (currentRole) renderAll();
  } catch {
    // Offline or the database isn't connected yet; walk-ins keep working.
  }
}
function loadAllBookings() {
  return [...onlineBookings, ...loadWalkinBookings()];
}

  const account = ACCOUNTS[role];
  if (role === "developer") {
    const viewing = viewAsRole && ACCOUNTS[viewAsRole];
    el.className = `inline-flex shrink-0 items-center gap-2 rounded-full border px-3 py-1.5 ${viewing ? "border-brand-amber/50 bg-brand-amber/10" : "border-line/10 bg-line/5"}`;
    el.innerHTML = `
      <i data-lucide="${viewing ? "eye" : "code"}" class="h-3.5 w-3.5 shrink-0 ${viewing ? "text-brand-amber" : "text-muted"}"></i>
      <label class="flex items-center gap-1.5 text-sm text-muted"><span class="hidden sm:inline">View as</span>
        <select onchange="setViewAs(this.value)" aria-label="View the dashboard as another role"
          class="cursor-pointer rounded-md border-0 bg-transparent py-0 pl-0 pr-6 text-sm font-medium text-ink focus:outline-none focus:ring-2 focus:ring-brand-red/20">
          ${Object.keys(ACCOUNTS).map((r) => `<option value="${r}" ${(viewAsRole || "developer") === r ? "selected" : ""}>${r === "developer" ? "Developer (all pages)" : ACCOUNTS[r].label}</option>`).join("")}
        </select>
      </label>`;
    return;
  }
  el.className = "inline-flex shrink-0 items-center gap-2 rounded-full border border-line/10 bg-line/5 px-3 py-1.5";
  el.innerHTML = `
    <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-brand-amber"></span>
    <span class="text-sm font-medium text-ink">${account ? account.label : role}</span>`;
}


function startApp(role) {

// ---------------------------------------------------------------------------
// Bookings calendar — counts walk-in units per appointment day. Bookings saved
// before the date field existed fall back to the timestamp in their id
// (`wb-<ms>`), and failing that to today.
// ---------------------------------------------------------------------------

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayKey() {
  return dateKey(new Date());
}
function bookingDateKey(b) {
  if (b.date) return b.date;
  const ms = Number(String(b.id || "").split("-")[1]);
  return ms > 1e12 ? dateKey(new Date(ms)) : todayKey();
}
function formatDateKey(key, opts) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", opts || { weekday: "short", month: "short", day: "numeric" });
}

const bookingCalendar = { year: new Date().getFullYear(), month: new Date().getMonth(), selected: null };

function shiftBookingMonth(delta) {
  const d = new Date(bookingCalendar.year, bookingCalendar.month + delta, 1);
  bookingCalendar.year = d.getFullYear();
  bookingCalendar.month = d.getMonth();
  renderAll();
}
function goToBookingToday() {
  const now = new Date();
  bookingCalendar.year = now.getFullYear();
  bookingCalendar.month = now.getMonth();
  bookingCalendar.selected = todayKey();
  renderAll();
}
function selectBookingDay(key) {
  bookingCalendar.selected = bookingCalendar.selected === key ? null : key;
  renderAll();
}

function renderBookingCalendar(bookings) {
  const { year, month, selected } = bookingCalendar;
  const counts = {};
  bookings.forEach((b) => {
    const k = bookingDateKey(b);
    counts[k] = counts[k] || { total: 0, done: 0 };
    counts[k].total += 1;
    if (b.status === "Completed") counts[k].done += 1;
  });

  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const leading = first.getDay();
  const today = todayKey();
  const monthLabel = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const monthTotal = Object.keys(counts)
    .filter((k) => k.startsWith(`${year}-${String(month + 1).padStart(2, "0")}-`))
    .reduce((s, k) => s + counts[k].total, 0);

  const cells = [];
  for (let i = 0; i < leading; i++) cells.push(`<div></div>`);
  for (let day = 1; day <= daysInMonth; day++) {
    const key = dateKey(new Date(year, month, day));
    const c = counts[key];
    const isToday = key === today;
    const isSelected = key === selected;
    // Busier days get a stronger tint so the heavy days stand out at a glance.
    const tint = !c ? "" : c.total >= 5 ? "bg-brand-red/20" : c.total >= 3 ? "bg-brand-red/[0.12]" : "bg-brand-red/[0.06]";
    cells.push(`
      <button onclick="selectBookingDay('${key}')" title="${c ? `${c.total} unit${c.total === 1 ? "" : "s"} booked${c.done ? ` · ${c.done} done` : ""}` : "No units booked"}"
        class="flex min-h-[56px] flex-col items-start justify-between rounded-lg border p-1.5 text-left transition-colors sm:min-h-[76px] sm:p-2 ${
          isSelected ? "border-brand-red ring-1 ring-brand-red" : "border-line/10 hover:border-line/25"
        } ${tint}">
        <span class="flex h-6 w-6 items-center justify-center rounded-full text-xs font-semibold tabular-nums ${
          isToday ? "bg-brand-red text-white" : "text-ink"
        }">${day}</span>
        ${c ? `<span class="text-[11px] font-semibold leading-tight text-ink tabular-nums">${c.total}<span class="hidden font-medium text-muted sm:inline"> unit${c.total === 1 ? "" : "s"}</span></span>` : ""}
      </button>`);
  }

  return `
    <div class="rounded-xl border border-line/10 bg-panel shadow-sm shadow-black/5">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-line/10 px-5 py-4">
        <div>
          <p class="font-heading text-base font-semibold text-ink">${monthLabel}</p>
          <p class="text-xs text-muted">${monthTotal} unit${monthTotal === 1 ? "" : "s"} booked this month</p>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="goToBookingToday()" class="rounded-lg border border-line/10 px-3 py-1.5 text-xs font-medium text-muted transition-colors hover:border-line/20 hover:bg-line/5 hover:text-ink">Today</button>
          <button onclick="shiftBookingMonth(-1)" aria-label="Previous month" class="flex h-8 w-8 items-center justify-center rounded-lg text-muted transition-colors hover:bg-line/5 hover:text-ink"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
          <button onclick="shiftBookingMonth(1)" aria-label="Next month" class="flex h-8 w-8 items-center justify-center rounded-lg text-muted transition-colors hover:bg-line/5 hover:text-ink"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
        </div>
      </div>
      <div class="p-3 sm:p-4">
        <div class="mb-2 grid grid-cols-7 gap-1 sm:gap-2">
          ${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => `<p class="text-center text-[11px] font-semibold uppercase tracking-wider text-muted">${d}</p>`).join("")}
        </div>
        <div class="grid grid-cols-7 gap-1 sm:gap-2">${cells.join("")}</div>
      </div>
    </div>`;
}

// Booking List — flat, searchable list of every booking (walk-in + website).
// Typing in the search box only re-renders the rows so the input keeps focus.
const bookingList = { query: "", status: "all", source: "all", payment: "all" };
const BOOKING_LIST_STATUSES = [
  { id: "all", label: "All" },
  { id: "upcoming", label: "Upcoming" },
  { id: "today", label: "Today" },
  { id: "completed", label: "Completed" },
];
const BOOKING_LIST_SOURCES = [
  { id: "all", label: "All sources" },
  { id: "walkin", label: "Walk-in" },
  { id: "website", label: "Website" },
];

function filteredBookingList() {
  const today = todayKey();
  const q = bookingList.query.trim().toLowerCase();
  return loadAllBookings()
    .filter((b) => {
      const key = bookingDateKey(b);
      const done = b.status === "Completed";
      if (bookingList.status === "upcoming" && (done || b.status === "Cancelled" || key < today)) return false;
      if (bookingList.status === "today" && key !== today) return false;
      if (bookingList.status === "completed" && !done) return false;
      if (bookingList.source === "website" && b.source !== "website") return false;
      if (bookingList.source === "walkin" && b.source === "website") return false;
      if (bookingList.payment !== "all" && bookingPayment(b) !== bookingList.payment) return false;
      if (!q) return true;
      return [b.ownerName, b.phone, b.email, b.vehicle, b.plate, b.service, b.notes, b.status, PAYMENT_LABELS[bookingPayment(b)]]
        .some((f) => String(f || "").toLowerCase().includes(q));
    })
    .sort((a, b) => {
      const ka = bookingDateKey(a), kb = bookingDateKey(b);
      // Upcoming reads best soonest-first; everything else newest-first.
      return bookingList.status === "upcoming" ? ka.localeCompare(kb) : kb.localeCompare(ka);
    });
}

function bookingListRowsHtml(rows) {
  if (!rows.length) {
    return `<tr><td colspan="9" class="px-4 py-8 text-center text-muted">${loadAllBookings().length ? "No bookings match these filters." : "No bookings yet."}</td></tr>`;
  }
  const today = todayKey();
  return rows.map((v) => {
    const key = bookingDateKey(v);
    return `
      <tr class="border-b border-line/5 transition-colors last:border-0 hover:bg-line/[0.02]">
        <td class="whitespace-nowrap px-4 py-3 tabular-nums ${key === today ? "font-semibold text-brand-red" : "text-ink"}">${key === today ? "Today" : formatDateKey(key)}</td>
        <td class="whitespace-nowrap px-4 py-3">
          <p class="text-ink">${v.ownerName || "—"}</p>
          ${v.phone ? `<p class="text-[11px] text-muted">${v.phone}</p>` : ""}
          ${v.email ? `<p class="text-[11px] text-muted">${v.email}</p>` : ""}
        </td>
        <td class="whitespace-nowrap px-4 py-3">
          <p class="text-ink">${v.vehicle || "—"}</p>
          ${v.plate ? `<p class="text-[11px] text-muted">${v.plate}</p>` : ""}
        </td>
        <td class="px-4 py-3 text-muted">
          <p>${v.service || "—"}</p>
          ${v.notes ? `<p class="mt-0.5 max-w-[260px] text-[11px]">Note: ${v.notes}</p>` : ""}
          ${v.photoCount ? `<div class="mt-1.5 flex gap-1.5">${Array.from({ length: v.photoCount }, (_, i) => `<a href="${BOOKINGS_API}?photo=${encodeURIComponent(v.id)}&n=${i}" target="_blank" rel="noopener" title="Open photo ${i + 1} of the unit"><img src="${BOOKINGS_API}?photo=${encodeURIComponent(v.id)}&n=${i}" alt="Unit photo ${i + 1}" loading="lazy" class="h-12 w-12 rounded-md border border-line/10 object-cover"></a>`).join("")}</div>` : ""}
        </td>
        <td class="whitespace-nowrap px-4 py-3 text-muted">${v.source === "website"
          ? `<span class="inline-flex items-center gap-1 text-brand-amber"><i data-lucide="globe" class="h-3.5 w-3.5"></i> Website</span>`
          : `<span class="inline-flex items-center gap-1"><i data-lucide="store" class="h-3.5 w-3.5"></i> Walk-in</span>`}</td>
        <td class="whitespace-nowrap px-4 py-3 text-muted">${v.time || "—"}</td>
        <td class="whitespace-nowrap px-4 py-3">
          <span class="rounded-full px-2 py-0.5 text-[11px] font-medium ${STATUS_STYLES[v.status] || "bg-line/10 text-muted"}">${v.status || "Booked"}</span>
        </td>
        <td class="whitespace-nowrap px-4 py-3">${paymentCellHtml(v)}</td>
        <td class="whitespace-nowrap px-4 py-3">
          ${v.status === "Completed"
            ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-brand-amber"><i data-lucide="check" class="h-3.5 w-3.5"></i> Done</span>`
            : `<button onclick="markWalkinDone('${v.id}')" class="rounded-lg border border-brand-amber/40 px-2 py-1 text-xs font-medium text-brand-amber transition-colors hover:bg-brand-amber/10">Mark as done</button>`}
        </td>
      </tr>`;
  }).join("");
}

function paymentCellHtml(v) {
  const pay = bookingPayment(v);
  const options = PAYMENT_STATES.map((p) => `<option value="${p}" ${p === pay ? "selected" : ""}>${PAYMENT_LABELS[p]}</option>`).join("");
  const hint = pay === "Unpaid" && v.downpayment
    ? `<p class="mt-1 text-[11px] text-muted">50% due: ${v.estimateFrom ? "at least " : ""}${peso(v.downpayment)}</p>`
    : "";
  return `<select onchange="setBookingPayment('${v.id}', this.value)" aria-label="Payment for ${v.ownerName || "this booking"}"
      class="cursor-pointer rounded-full border px-2.5 py-1 text-[11px] font-semibold focus:outline-none focus:ring-2 focus:ring-brand-red/20 ${PAYMENT_STYLES[pay]}">${options}</select>${hint}`;
}

async function setBookingPayment(id, payment) {
  if (!PAYMENT_STATES.includes(payment)) return;
  const online = onlineBookings.find((b) => b.id === id);
  if (online) {
    try {
      const res = await fetch(BOOKINGS_API, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, payment }),
      });
      if (!res.ok) throw new Error();
      online.payment = payment;
      onlineBookingsSnapshot = ""; // pick up the saved copy on the next poll
    } catch {
      alert("Couldn't update the payment on this website booking. Check your internet connection and try again.");
    }
    afterPaymentChange();
    return;
  }
  const bookings = loadWalkinBookings();
  const booking = bookings.find((b) => b.id === id);
  if (!booking) return;
  booking.payment = payment;
  saveWalkinBookings(bookings);
  afterPaymentChange();
}
// The Booking List only redraws its rows so the search box keeps focus;
// other pages (Financials) redraw fully.
function afterPaymentChange() {
  if (state.section === "bookinglist") refreshBookingListRows();
  else renderAll();
}

function refreshBookingListRows() {
  const rows = filteredBookingList();
  const body = document.getElementById("booking-list-body");

async function markWalkinDone(id) {
  const online = onlineBookings.find((b) => b.id === id);
  if (online) {
    try {
      const res = await fetch(BOOKINGS_API, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, status: "Completed" }),
      });
      if (!res.ok) throw new Error();
      online.status = "Completed";
      onlineBookingsSnapshot = ""; // pick up the saved copy on the next poll
      renderAll();
    } catch {
      alert("Couldn't update this website booking. Check your internet connection and try again.");
    }
    return;
  }
  const bookings = loadWalkinBookings();
  const booking = bookings.find((b) => b.id === id);
  if (!booking) return;
  booking.status = "Completed";
  saveWalkinBookings(bookings);
  renderAll();
}

// Instrument cluster — SVG dials, a centre console and warning lights.
// ---------------------------------------------------------------------------

// Remembers each dial's last needle angle so a re-render (e.g. switching
// timeframe) swings the needle from where it was rather than from zero.
const lastGaugeDeg = {};
let clusterBooted = false;

function gaugePolar(r, deg) {
  const a = (deg * Math.PI) / 180;
  return [100 + r * Math.sin(a), 100 - r * Math.cos(a)];
}
function gaugeArc(r, from, to) {
  const [x1, y1] = gaugePolar(r, from);
  const [x2, y2] = gaugePolar(r, to);
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${to - from > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
// Rounds the dial's full-scale up to a 1/2/2.5/5 x 10^n step with headroom.
function gaugeNiceMax(v) {
  if (v <= 0) return 10;
  const target = v * 1.3;
  const p = Math.pow(10, Math.floor(Math.log10(target)));
  const n = target / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function compactNum(n) {
  if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
  return String(Math.round(n * 10) / 10);
}

function gaugeHtml({ id, value, max, label, unit, display, boot }) {
  const pct = Math.max(0, Math.min(1, value / max));
  const deg = -120 + pct * 240;
  const from = lastGaugeDeg[id] ?? -120;
  lastGaugeDeg[id] = deg;
  const fromPct = ((from + 120) / 240) * 100;

  let ticks = "";
  for (let i = 0; i <= 50; i++) {
    const a = -120 + i * 4.8;
    const major = i % 10 === 0;
    const inner = major ? 68 : i % 5 === 0 ? 72 : 75;
    const [x1, y1] = gaugePolar(79, a);
    const [x2, y2] = gaugePolar(inner, a);
    const red = i >= 42;
    ticks += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${red ? "#E63946" : major ? "#EDEEF0" : "rgba(237,238,240,.45)"}" stroke-width="${major ? 2 : 1}" stroke-linecap="round"/>`;
    if (major) {
      const [tx, ty] = gaugePolar(57, a);
      ticks += `<text x="${tx.toFixed(2)}" y="${(ty + 3).toFixed(2)}" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="8" font-weight="600" fill="${red ? "#E63946" : "rgba(237,238,240,.75)"}">${compactNum((max * i) / 50)}</text>`;
    }
  }

  const shown = display ?? compactNum(value);
  return `
    <svg viewBox="0 0 200 186" class="block h-auto w-full" role="img" aria-label="${label}: ${shown}${unit || ""}">
      <defs>
        <linearGradient id="gauge-grad-${id}" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#F2A93B"/>
          <stop offset="1" stop-color="#E63946"/>
        </linearGradient>
        <radialGradient id="gauge-face-${id}" cx="50%" cy="45%" r="55%">
          <stop offset="0" stop-color="#1c1e23"/>
          <stop offset="1" stop-color="#0b0c0e"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="92" fill="url(#gauge-face-${id})" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="2"/>
      <path d="${gaugeArc(84, -120, 120)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="4" stroke-linecap="round"/>
      <path d="${gaugeArc(84, -120 + 0.84 * 240, 120)}" fill="none" stroke="rgba(230,57,70,.55)" stroke-width="4" stroke-linecap="round"/>
      <path d="${gaugeArc(84, -120, 120)}" pathLength="100" class="gauge-arc" style="--pct:${(pct * 100).toFixed(2)};--from-pct:${fromPct.toFixed(2)}" fill="none" stroke="url(#gauge-grad-${id})" stroke-width="4" stroke-linecap="round" filter="drop-shadow(0 0 3px rgba(230,57,70,.8))"/>
      ${ticks}
      <g class="gauge-needle ${boot ? "boot" : ""}" style="--deg:${deg.toFixed(2)}deg;--from:${from.toFixed(2)}deg">
        <polygon points="98,106 102,106 100.5,26 99.5,26" fill="#E63946" filter="drop-shadow(0 0 3px rgba(230,57,70,.9))"/>
      </g>
      <circle cx="100" cy="100" r="9" fill="#16181c" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="3" fill="#E63946"/>
      <text x="100" y="146" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="19" font-weight="700" fill="#EDEEF0">${shown}<tspan font-size="9" fill="#8D929B">${unit || ""}</tspan></text>
      <text x="100" y="163" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.2" fill="#8D929B">${label.toUpperCase()}</text>
    </svg>`;
}

                  status === s ? "bg-brand-red/10 text-brand-red" : "text-muted hover:bg-line/5 hover:text-ink"
                }">
                <span class="truncate">${s}</span>
                <span class="shrink-0 text-[11px] opacity-75">${count}</span>
              </button>`;
            }).join("")}
          </div>
          <div class="flex-1 overflow-y-auto p-5">
            <div class="mb-4 grid grid-cols-3 gap-2">
              ${ch.metrics.map((m) => `
                <div class="rounded-xl bg-line/5 p-2.5 text-center">
                  <p class="text-sm font-semibold text-brand-amber">${fmt(m.value)}${typeof m.value === "number" ? m.unit : ""}</p>
                  <p class="mt-0.5 text-[11px] leading-tight text-muted">${m.label}</p>
                </div>`).join("")}
            </div>
            <p class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-muted">${ch.recentLabel}${status !== "Overview" ? ` — ${status}` : ""}</p>
            <ul class="space-y-2">
              ${filteredItems.length ? filteredItems.map((item) => `
                <li class="flex items-start gap-3 rounded-xl border border-line/10 p-3 transition-colors hover:border-line/20">
                  <i data-lucide="file-text" class="mt-0.5 h-4 w-4 shrink-0 text-brand-amber"></i>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-start justify-between gap-2">
                      <p class="text-sm font-medium text-ink">${item.title}</p>
                      <span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-medium ${STATUS_STYLES[item.status] || "bg-line/10 text-muted"}">${item.status}</span>
                    </div>
                    <p class="mt-0.5 text-xs text-muted">${item.sub}</p>
                    <div class="mt-1 flex items-center gap-1 text-[11px] text-muted">
                      <i data-lucide="clock" class="h-3 w-3"></i>
                      ${item.time}
                    </div>
                  </div>
                </li>`).join("") : `<li class="rounded-lg border border-line/10 p-4 text-center text-sm text-muted">No items with this status.</li>`}
            </ul>
          </div>
        </div>
      </div>
    </div>`;
  lucide.createIcons();
}

// Exact name match first, then the longest catalog name contained in the
// text (so "2010 Ford F-150 XLT" still finds the F-150).
function findCarModel(text) {
  const t = (text || "").trim().toLowerCase();
  if (!t) return null;
  return CAR_MODELS.find((c) => c.name.toLowerCase() === t) ||
    CAR_MODELS.filter((c) => t.includes(c.name.toLowerCase()) || t.includes(c.name.split(" ").slice(1).join(" ").toLowerCase()))
      .sort((a, b) => b.name.length - a.name.length)[0] || null;
}
function carSiteLabel(url) {
  return new URL(url).hostname.replace(/^www\./, "");
}
// Small photo tile; falls back to a car icon if the image can't load.
function carThumbHtml(car, size) {
  const box = size === "lg" ? "h-24 w-36" : "h-9 w-14";
  if (!car) return `<span class="flex ${box} shrink-0 items-center justify-center rounded-md bg-line/5 text-muted"><i data-lucide="car" class="h-4 w-4"></i></span>`;
  return `<span class="relative flex ${box} shrink-0 items-center justify-center overflow-hidden rounded-md bg-line/5 text-muted">
      <i data-lucide="car" class="h-4 w-4"></i>
      <img src="${car.photo}" alt="${car.name}" loading="lazy" referrerpolicy="no-referrer" class="absolute inset-0 h-full w-full object-cover" onerror="this.remove()">
    </span>`;
}
function carLinkHtml(car) {
  if (!car) return "";
  return `<a href="${car.url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open ${car.name} on ${carSiteLabel(car.url)}"
      class="inline-flex items-center gap-1 text-xs font-medium text-brand-amber hover:underline">${carSiteLabel(car.url)}<i data-lucide="external-link" class="h-3 w-3"></i></a>`;
}

function closeBookingForm() {

function previewVisit() {
  const preview = document.getElementById("bf-visit-preview");
  const name = document.getElementById("bf-owner").value;
  const phone = document.getElementById("bf-phone").value;
  const key = getCustomerKey(name, phone);
  if (!key) { preview.textContent = ""; return; }
  const existing = loadCustomers()[key];
  preview.textContent = existing
    ? `Returning customer — this will be visit #${existing.visits + 1}. Last visit: ${existing.lastVisit}.`
    : "New customer — this will be their first visit.";
}

function submitBooking(event) {
  event.preventDefault();
  const ownerName = document.getElementById("bf-owner").value.trim();
  const phone = document.getElementById("bf-phone").value.trim();
  const vehicle = document.getElementById("bf-vehicle").value.trim();
  const plate = document.getElementById("bf-plate").value.trim();
  const service = document.getElementById("bf-service").value;
  const notes = document.getElementById("bf-notes").value.trim();
  const date = document.getElementById("bf-date").value || todayKey();

  const key = getCustomerKey(ownerName, phone);
  const customers = loadCustomers();
  const visitNumber = customers[key] ? customers[key].visits + 1 : 1;
  customers[key] = { name: ownerName, phone, visits: visitNumber, lastVisit: "Today" };
  saveCustomers(customers);

  const visitLabel = visitNumber === 1 ? "1st visit" : `Visit #${visitNumber}`;
  const bookings = loadWalkinBookings();
  bookings.unshift({
    id: `wb-${Date.now()}`,
    title: `Walk-in — ${service}`,
    sub: `${vehicle}${plate ? " · Plate " + plate : ""} · Owner: ${ownerName} · ${visitLabel}${date !== todayKey() ? " · For " + formatDateKey(date) : ""}${notes ? " · " + notes : ""}`,
    status: "Booked",
    payment: "Unpaid",
    time: "Just now",
    date,
    ownerName,
    phone,
    vehicle,
    plate,
    service,
    visitNumber,
  });
  saveWalkinBookings(bookings);

  closeBookingForm();
  // From the Bookings page, jump the calendar to the booked day instead of
  // opening the channel popup.
  if (state.section === "bookings") {
    const [y, m] = date.split("-").map(Number);
    bookingCalendar.year = y;
    bookingCalendar.month = m - 1;
    bookingCalendar.selected = date;
    renderAll();
  } else {
    renderAll();
    openModal("walkin");
  }
}

function countNewItems() {
  return CHANNELS.reduce((sum, ch) => sum + getDisplayRecentItems(ch).filter((i) => i.status === "New").length, 0);
}

// Builds the Overview "Needs your attention" list: one row per channel+status
// combo that has at least one item in an ATTENTION_STATUSES bucket, ranked by
// urgency then by how many items are waiting.
function buildAttentionItems() {
  const rows = [];
  CHANNELS.forEach((ch) => {
    const items = getDisplayRecentItems(ch);
    ATTENTION_STATUSES.forEach((status) => {
      const count = items.filter((i) => i.status === status).length;
      if (count > 0) rows.push({ channelId: ch.id, channelName: ch.name, status, count });
    });
  });
  rows.sort((a, b) => {
    const rank = ATTENTION_STATUSES.indexOf(a.status) - ATTENTION_STATUSES.indexOf(b.status);
    return rank !== 0 ? rank : b.count - a.count;
  });
  return rows.slice(0, 5);
}

function renderRevenueByChannel() {
  const paid = paidTransactions();
  const total = paid.reduce((s, t) => s + t.amount, 0) || 1;
  const rows = CHANNELS.map((ch) => {

    return { ch, amount, pct: Math.round((amount / total) * 100) };
  }).filter((r) => r.amount > 0).sort((a, b) => b.amount - a.amount);

  if (!rows.length) return `<p class="rounded-xl border border-line/10 bg-line/5 p-4 text-center text-sm text-muted">No paid transactions yet.</p>`;
  return `<ul class="space-y-3">` + rows.map((r) => `

        <span class="flex items-center gap-2 text-ink"><i data-lucide="${r.ch.icon}" class="h-3.5 w-3.5 shrink-0 text-brand-amber"></i><span class="truncate">${r.ch.name}</span></span>

}

// Shared by the Financials page and the Overview snapshot so both always
// show the same figures.
function buildFinancialKpis() {
  const paid = paidTransactions();
  const totalRevenue = paid.reduce((s, t) => s + t.amount, 0);
  const avgTicket = paid.length ? Math.round(totalRevenue / paid.length) : 0;
  const unpaidBookings = unpaidBookingInvoices();
  const unpaidBookingTotal = unpaidBookings.reduce((s, i) => s + i.balance, 0);
  return [
    { label: "Total Revenue", value: peso(scaleValue(totalRevenue, false)), sub: "Across all channels", icon: "trending-up" },
    { label: "Average Ticket", value: peso(avgTicket), sub: "Per completed service", icon: "receipt" },
    { label: "Transactions", value: fmt(scaleValue(paid.length, false)), sub: "Completed payments", icon: "arrow-left-right" },
    { label: "Unpaid Bookings", value: peso(unpaidBookingTotal), sub: `${unpaidBookings.length} booking(s) not fully paid`, icon: "file-clock" },
  ];
}

// ---------------------------------------------------------------------------
// Unpaid booking invoices — real bookings (website + walk-in) that are not
// fully paid yet. Amounts come from the website estimate; walk-ins have no
// price recorded, so their amount shows as "to be set".
// ---------------------------------------------------------------------------
const unpaidInvoiceView = { filter: "all" };

function estimateTotal(estimate) {
  const m = /₱\s?([\d,]+(?:\.\d+)?)/.exec(String(estimate || ""));
  return m ? Number(m[1].replace(/,/g, "")) : 0;
}
function invoiceNumber(b) {
  const tail = String(b.id || "").split("-").pop() || "";
  return "INV-" + tail.slice(-6).toUpperCase();
}
function bookingInvoice(b) {
  const pay = bookingPayment(b);
  const total = estimateTotal(b.estimate);
  const half = Math.ceil(total / 2);
  const paid = pay === "Downpayment paid" ? half : 0;
  const key = bookingDateKey(b);
  const today = todayKey();
  return {
    b, pay, total, paid,
    balance: total - paid,
    dueNow: pay === "Unpaid" ? half : total - paid,
    isFrom: /^\s*from\b/i.test(b.estimate || "") || /quote/i.test(b.estimate || ""),
    number: invoiceNumber(b),
    dateKey: key,
    overdue: key < today,
    today: key === today,
  };
}
function unpaidBookingInvoices() {
  return loadAllBookings()
    .filter((b) => b.status !== "Cancelled" && bookingPayment(b) !== "Fully paid")
    .map(bookingInvoice)
    .sort((a, b) => a.dateKey.localeCompare(b.dateKey));
}
function setUnpaidInvoiceFilter(id) {
  unpaidInvoiceView.filter = id;
  renderAll();
}
function invoiceAmountText(inv, amount) {
  return inv.total ? (inv.isFrom ? "from " : "") + peso(amount) : "Price to be set";
}

function renderUnpaidBookingInvoices() {
  const all = unpaidBookingInvoices();
  const counts = {
    all: all.length,
    Unpaid: all.filter((i) => i.pay === "Unpaid").length,
    "Downpayment paid": all.filter((i) => i.pay === "Downpayment paid").length,
    overdue: all.filter((i) => i.overdue).length,
  };
  const tabs = [
    { id: "all", label: "All not fully paid" },
    { id: "Unpaid", label: "No 50% yet" },
    { id: "Downpayment paid", label: "Partial (50% paid)" },
    { id: "overdue", label: "Service date passed" },
  ];
  const f = unpaidInvoiceView.filter;
  const rows = all.filter((i) => f === "all" || (f === "overdue" ? i.overdue : i.pay === f));
  const tabRow = `<div class="mb-3 flex flex-wrap gap-2">` + tabs.map((t) => `
    <button onclick="setUnpaidInvoiceFilter('${t.id}')"
      class="rounded-lg px-3 py-1.5 text-xs font-medium transition-colors ${f === t.id ? "bg-ink text-canvas" : "bg-line/5 text-muted hover:text-ink"}">${t.label} <span class="opacity-70">${counts[t.id]}</span></button>`).join("") + `</div>`;
  if (!rows.length) return tabRow + emptyNote(all.length ? "No invoices match this filter." : "Every booking is fully paid.");

  return tabRow + `<div class="overflow-x-auto rounded-xl border border-line/10">
    <table class="w-full text-left text-sm">
      <thead>
        <tr class="border-b border-line/10 bg-line/[0.03] text-[11px] font-semibold uppercase tracking-wider text-muted">
          <th class="whitespace-nowrap px-4 py-3">Invoice</th>
          <th class="whitespace-nowrap px-4 py-3">Customer</th>
          <th class="whitespace-nowrap px-4 py-3">Service</th>
          <th class="whitespace-nowrap px-4 py-3">Booking date</th>
          <th class="whitespace-nowrap px-4 py-3 text-right">Total</th>
          <th class="whitespace-nowrap px-4 py-3 text-right">Paid</th>
          <th class="whitespace-nowrap px-4 py-3 text-right">Balance</th>
          <th class="whitespace-nowrap px-4 py-3">Status</th>
          <th class="whitespace-nowrap px-4 py-3">Action</th>
        </tr>
      </thead>
      <tbody>${rows.map((inv) => {
        const b = inv.b;
        return `
        <tr class="border-b border-line/5 last:border-0 hover:bg-line/[0.02]">
          <td class="whitespace-nowrap px-4 py-3">
            <p class="font-medium tabular-nums text-ink">${inv.number}</p>
            <p class="text-[11px] text-muted">${b.source === "website" ? "Website" : "Walk-in"}</p>
          </td>
          <td class="whitespace-nowrap px-4 py-3">
            <p class="text-ink">${b.ownerName || "—"}</p>
            ${b.phone ? `<p class="text-[11px] text-muted">${b.phone}</p>` : ""}
          </td>
          <td class="px-4 py-3 text-muted">
            <p class="max-w-[220px]">${b.service || "—"}</p>
            <p class="text-[11px]">${b.vehicle || ""}${b.plate ? " · " + b.plate : ""}</p>
          </td>
          <td class="whitespace-nowrap px-4 py-3 tabular-nums ${inv.overdue ? "font-semibold text-brand-red" : inv.today ? "font-semibold text-ink" : "text-ink"}">
            ${inv.today ? "Today" : formatDateKey(inv.dateKey)}
            ${inv.overdue ? `<p class="text-[11px] font-medium">Service date passed</p>` : ""}
          </td>
          <td class="whitespace-nowrap px-4 py-3 text-right tabular-nums text-ink">${invoiceAmountText(inv, inv.total)}</td>
          <td class="whitespace-nowrap px-4 py-3 text-right tabular-nums text-muted">${inv.paid ? peso(inv.paid) : inv.pay === "Downpayment paid" ? "50%" : "₱0"}</td>
          <td class="whitespace-nowrap px-4 py-3 text-right font-semibold tabular-nums text-ink">
            ${invoiceAmountText(inv, inv.balance)}
            ${inv.pay === "Unpaid" && inv.total ? `<p class="text-[11px] font-normal text-brand-red">50% due: ${inv.isFrom ? "at least " : ""}${peso(inv.dueNow)}</p>` : ""}
          </td>

function emptyNote(text) {
  return `<p class="rounded-xl border border-line/10 bg-line/5 p-4 text-center text-sm text-muted">${text}</p>`;
}

function amountBars(rows) {
  const max = Math.max(...rows.map((r) => r.amount), 1);
  return `<ul class="space-y-3">` + rows.map((r) => `
    <li>
      <div class="mb-1 flex items-center justify-between gap-2 text-sm">
        <span class="flex min-w-0 items-center gap-2 text-ink"><i data-lucide="${r.icon}" class="h-3.5 w-3.5 shrink-0 text-brand-amber"></i><span class="truncate">${r.label}</span></span>
        <span class="shrink-0 font-semibold tabular-nums text-ink">${peso(r.amount)}</span>
      </div>
      <div class="seg-h h-2.5 w-full overflow-hidden bg-line/10">
        <div class="h-full bg-gradient-to-r from-brand-amber to-brand-red" style="width:${Math.round((r.amount / max) * 100)}%"></div>
      </div>
    </li>`).join("") + `</ul>`;
}

function renderSalesByMethod() {
  const paid = paidTransactions();
  const rows = Object.keys(PAYMENT_METHOD_ICON).map((m) => ({
    label: m, icon: PAYMENT_METHOD_ICON[m],
    amount: paid.filter((t) => t.method === m).reduce((s, t) => s + t.amount, 0),
  })).filter((r) => r.amount > 0).sort((a, b) => b.amount - a.amount);
  return rows.length ? amountBars(rows) : emptyNote("No paid sales yet.");
}

function renderTopServices() {
  const rows = paidTransactions().slice().sort((a, b) => b.amount - a.amount).slice(0, 5).map((t) => {
    const ch = CHANNELS.find((c) => c.id === t.channelId);
    return { label: t.service, icon: ch ? ch.icon : "receipt", amount: t.amount };
  });
  return rows.length ? amountBars(rows) : emptyNote("No paid sales yet.");
}

function renderSalesSection() {
  const root = document.getElementById("section-root");
  const paid = paidTransactions();
  const gross = paid.reduce((s, t) => s + t.amount, 0);
  const refunds = TRANSACTIONS.filter((t) => t.status === "Refunded").reduce((s, t) => s + t.amount, 0);
  const pending = TRANSACTIONS.filter((t) => t.status === "Pending");
  const pendingTotal = pending.reduce((s, t) => s + t.amount, 0);

  root.innerHTML = `
    <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
      ${statCard("Gross Sales", peso(gross), `${paid.length} paid sale(s)`, "shopping-cart")}
      ${statCard("Refunds", peso(refunds), "Returned to customers", "undo-2")}
      ${statCard("Net Sales", peso(gross - refunds), "Gross less refunds", "trending-up")}

    <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
      ${overviewCard("Sales by payment method", renderSalesByMethod())}

    </div>
    ${overviewCard("Sales log", renderTransactionFilterRow() + renderTransactionsList())}`;
}

const DEFAULT_STOCK = [
  { id: "st-1", name: "Car shampoo", category: "Washing", qty: 18, unit: "L", reorderAt: 10, unitCost: 180 },
  { id: "st-2", name: "Carnauba wax", category: "Finishing", qty: 6, unit: "tubs", reorderAt: 4, unitCost: 650 },

  { id: "st-4", name: "Microfiber towels", category: "Tools", qty: 64, unit: "pcs", reorderAt: 30, unitCost: 45 },
  { id: "st-5", name: "Interior cleaner", category: "Interior", qty: 9, unit: "L", reorderAt: 6, unitCost: 220 },
  { id: "st-6", name: "Odor eliminator", category: "Interior", qty: 0, unit: "bottles", reorderAt: 4, unitCost: 300 },
  { id: "st-7", name: "Tire shine", category: "Finishing", qty: 7, unit: "bottles", reorderAt: 5, unitCost: 260 },
  { id: "st-8", name: "Engine degreaser", category: "Washing", qty: 4, unit: "L", reorderAt: 5, unitCost: 240 },
];

function loadStock() {
  try {
    const saved = JSON.parse(localStorage.getItem(STOCK_KEY));
    if (Array.isArray(saved)) return saved;
  } catch (e) {}
  return DEFAULT_STOCK.map((s) => ({ ...s }));
}
function saveStock(items) {
  try { localStorage.setItem(STOCK_KEY, JSON.stringify(items)); } catch (e) {}
}
function stockStatus(item) {
  if (item.qty <= 0) return "Out of stock";
  if (item.qty <= item.reorderAt) return "Low stock";
  return "In stock";
}
const STOCK_STATUS_STYLES = {
  "In stock": "bg-brand-amber/15 text-brand-amber",
  "Low stock": "bg-line/10 text-muted",
  "Out of stock": "bg-brand-red/15 text-brand-red",
};

function adjustStock(id, delta) {
  const items = loadStock();
  const item = items.find((s) => s.id === id);
  if (!item) return;
  item.qty = Math.max(0, item.qty + delta);
  saveStock(items);
  renderAll();
}

function removeStockItem(id) {
  const item = loadStock().find((s) => s.id === id);
  if (!item || !confirm(`Remove "${item.name}" from stocks?`)) return;
  saveStock(loadStock().filter((s) => s.id !== id));
  renderAll();
}

function addStockItem(event) {
  event.preventDefault();
  const val = (id) => document.getElementById(id).value.trim();
  const items = loadStock();
  items.push({
    id: "st-" + Date.now(),
    name: val("sf-name"),
    category: val("sf-category") || "General",
    qty: Math.max(0, Number(val("sf-qty")) || 0),
    unit: val("sf-unit") || "pcs",
    reorderAt: Math.max(0, Number(val("sf-reorder")) || 0),
    unitCost: Math.max(0, Number(val("sf-cost")) || 0),
  });
  saveStock(items);
  renderAll();
}

const FIELD_CLASS = "w-full rounded-lg border border-line/10 bg-line/5 px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:border-brand-red/60 focus:outline-none focus:ring-2 focus:ring-brand-red/15";

  if (!items.length) return emptyNote("No items yet — add one below.");

            return `

                <p class="whitespace-nowrap font-medium text-ink">${escapeHtml(s.name)}</p>

                </div>
              </td>
              <td class="whitespace-nowrap px-3 py-2.5 tabular-nums text-muted">${s.reorderAt} ${escapeHtml(s.unit)}</td>
              <td class="whitespace-nowrap px-3 py-2.5 tabular-nums text-ink">${peso(s.qty * s.unitCost)}</td>
              <td class="px-3 py-2.5"><span class="whitespace-nowrap rounded-full px-2 py-0.5 text-[11px] font-medium ${STOCK_STATUS_STYLES[status]}">${status}</span></td>
              <td class="px-3 py-2.5 text-right">
                <button onclick="removeStockItem('${s.id}')" title="Remove item" class="rounded-lg p-1.5 text-muted transition-colors hover:bg-brand-red/10 hover:text-brand-red"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

function setEquipmentCondition(id, condition) {
  updateEquipment(id, { condition });
}
function markEquipmentServiced(id) {
  updateEquipment(id, { lastService: todayKey(), condition: "Good" });
}

function removeEquipment(id) {
  const item = loadEquipment().find((e) => e.id === id);
  if (!item || !confirm(`Remove "${item.name}" (${item.location}) from inventory?`)) return;
  saveEquipment(loadEquipment().filter((e) => e.id !== id));
  renderAll();
}

function addEquipment(event) {
  event.preventDefault();
  const val = (id) => document.getElementById(id).value.trim();
  const items = loadEquipment();
  items.push({
    id: "eq-" + Date.now(),
    name: val("ef-name"),
    category: val("ef-category") || "General",
    location: val("ef-location") || "Shop",
    condition: val("ef-condition"),
    lastService: val("ef-service"),
  });
  saveEquipment(items);
  renderAll();
}

function resetEquipmentList() {
  if (!confirm("Reset the inventory to the starting equipment? Any changes and items you added will be lost.")) return;
  try { localStorage.removeItem(EQUIPMENT_KEY); } catch (e) {}
  renderAll();
}

function daysSince(key) {
  if (!key) return null;
  return Math.floor((new Date(todayKey() + "T00:00:00") - new Date(key + "T00:00:00")) / 86400000);
}

        class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors ${enabled ? "bg-brand-amber" : "bg-line/20"} ${locked ? "cursor-not-allowed" : ""}">

}

function toggleAccountActive(role) {
  if (role === currentRole) return;
  ACCOUNTS[role].active = !ACCOUNTS[role].active;
  renderAccessSection();
  lucide.createIcons();
}

function toggleSectionAccess(role, sectionId) {
  if (role === currentRole && sectionId === "access") return;
  const account = ACCOUNTS[role];
  account.sections = account.sections.includes(sectionId)
    ? account.sections.filter((id) => id !== sectionId)
    : [...account.sections, sectionId];
  // If this just revoked the section currentRole is standing on, renderAll()
  // catches it and falls back to that role's first remaining section.
  renderAll();
}

function updateAccountPassword(event, role) {
  event.preventDefault();
  const input = document.getElementById(`access-password-${role}`);
  ACCOUNTS[role].password = input.value;
  input.value = "";
  document.getElementById(`access-confirm-${role}`).classList.remove("hidden");
}

function renderAccessSection() {
  const root = document.getElementById("section-root");
  root.innerHTML = `

      This is a front-end-only demo login gate — sign-in, page access, and password changes here apply for the current browser session only and reset on reload. There's no backend, so this does not protect sensitive data.
    </p>`;
}

async function runDevApiCheck() {
  devApiCheck.state = "checking";
  renderAll();
  const started = performance.now();
  try {
    const res = await fetch(BOOKINGS_API, { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    devApiCheck.ms = Math.round(performance.now() - started);
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    devApiCheck.count = (data.bookings || []).length;
    devApiCheck.state = "ok";
    devApiCheck.error = "";
  } catch (err) {
    devApiCheck.state = "error";
    devApiCheck.error = err.message || "Could not reach the booking API.";
  }
  devApiCheck.at = new Date();
  onlineBookingsSnapshot = "";
  await fetchOnlineBookings();
  renderAll();
}
function devStorageKeys() {
  const rows = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith("mrklin")) continue;
      rows.push({ key, size: (localStorage.getItem(key) || "").length });
    }
  } catch { /* storage blocked */ }
  return rows.sort((a, b) => a.key.localeCompare(b.key));
}
function devClearKey(key) {
  if (!confirm(`Delete "${key}" from this browser?\n\nThis can't be undone.${key === SESSION_KEY ? " You will be signed out." : ""}`)) return;

  renderAll();
}

      <div class="overflow-x-auto rounded-xl border border-line/10">
        <table class="w-full text-left text-sm">
          <thead><tr class="border-b border-line/10 bg-line/[0.03] text-[11px] font-semibold uppercase tracking-wider text-muted">
            <th class="px-4 py-3">Key</th><th class="px-4 py-3 text-right">Size</th><th class="px-4 py-3">Action</th></tr></thead>
          <tbody>${storage.map((s) => `
            <tr class="border-b border-line/5 last:border-0">
              <td class="px-4 py-2.5 font-mono text-xs text-ink">${escapeHtml(s.key)}</td>
              <td class="whitespace-nowrap px-4 py-2.5 text-right tabular-nums text-muted">${kb(s.size)}</td>
              <td class="px-4 py-2.5"><button onclick="devClearKey('${escapeHtml(s.key)}')" class="rounded-lg border border-brand-red/40 px-2 py-1 text-xs font-medium text-brand-red transition-colors hover:bg-brand-red/10">Clear</button></td>
            </tr>`).join("")}</tbody>
        </table>
      </div>
      <p class="mt-2 text-xs text-muted">Walk-in bookings, their payment status, and settings live only in this browser. Clearing a key deletes it here only — website bookings are stored online and aren't affected.</p>`
      : emptyNote("Nothing stored in this browser yet."))}`;
}

const SECTION_RENDERERS = {
  overview: renderOverviewSection,
  services: renderServicesSection,
  sales: renderSalesSection,
  financials: renderFinancialsSection,
  stocks: renderStocksSection,
  inventory: renderInventorySection,
  settings: renderSettingsSection,
  access: renderAccessSection,
  developer: renderDeveloperSection,
  bookings: renderBookingsSection,
  bookinglist: renderBookingListSection,
};

function renderAll() {
  // Fully data-driven on ACCOUNTS[role].sections: if a toggle on the User
  // Access page just revoked the section currentRole is sitting on (most
  // relevantly, an Owner editing their own permissions), fall back to
  // whatever that role's first remaining section is.
  const allowedSections = sectionsForRole(viewRole()).map((s) => s.id);
  if (!allowedSections.includes(state.section)) {
    state.section = allowedSections[0] || "overview";
  }

  renderSidebar();
  renderHeaderRolePill(currentRole, "user-badge");
  renderThemeToggle();
  renderNotifBell();
  renderNotifPanel();
  renderPageHeader();
  (SECTION_RENDERERS[state.section] || renderOverviewSection)();
  lucide.createIcons();
}

bootstrap();
</script>
</body>
</html>
