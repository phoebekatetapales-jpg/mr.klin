// Status chips are grouped into three brand-safe tiers rather than
// per-status rainbow colors: red = needs attention, amber = positive/done,
// neutral = informational.
const STATUS_STYLES = {
  New: "bg-white/10 text-muted", Booked: "bg-brand-amber/15 text-brand-amber",
  Quoted: "bg-white/10 text-muted", "Follow-up": "bg-white/10 text-muted",
  Closed: "bg-white/10 text-muted", "In progress": "bg-white/10 text-muted",
  "En route": "bg-white/10 text-muted", Completed: "bg-brand-amber/15 text-brand-amber",

  Viewed: "bg-white/10 text-muted", Credited: "bg-brand-amber/15 text-brand-amber",

};

const KPIS = [
  { id: "inquiries", label: "Total Inquiries", icon: "inbox", base: 96, unit: "", accent: "text-brand-red", ring: "bg-brand-red/15" },
  { id: "bookings", label: "Active Bookings", icon: "calendar-check", base: 34, unit: "", accent: "text-brand-amber", ring: "bg-brand-amber/15" },
  { id: "retention", label: "Retention Rate", icon: "repeat", base: 57, unit: "%", accent: "text-brand-red", ring: "bg-brand-red/15", flat: true },

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const state = { timeframe: "today", serviceType: "all" };

function getFactor() {
  return TIMEFRAMES.find((t) => t.id === state.timeframe).factor;
}
function scaleValue(value, flat) {
  const factor = getFactor();
  if (flat || typeof value !== "number") return value;
  return Math.round(value * factor);
}
function fmt(n) {
  return typeof n === "number" ? n.toLocaleString("en-US") : n;
}

// Walk-in bookings and customer visit counts live in localStorage since this
// dashboard has no backend — they persist on this browser/device only.
const CUSTOMERS_KEY = "mrklin_customers_v1";
const WALKIN_BOOKINGS_KEY = "mrklin_walkin_bookings_v1";

function loadCustomers() {
  try { return JSON.parse(localStorage.getItem(CUSTOMERS_KEY)) || {}; } catch { return {}; }
}
function saveCustomers(customers) {
  localStorage.setItem(CUSTOMERS_KEY, JSON.stringify(customers));
}
function loadWalkinBookings() {
  try { return JSON.parse(localStorage.getItem(WALKIN_BOOKINGS_KEY)) || []; } catch { return []; }
}
function saveWalkinBookings(bookings) {
  localStorage.setItem(WALKIN_BOOKINGS_KEY, JSON.stringify(bookings));
}
function normalizePhone(phone) {
  return (phone || "").replace(/\D/g, "");
}
function getCustomerKey(name, phone) {
  return normalizePhone(phone) || (name || "").trim().toLowerCase();
}
function getDisplayRecentItems(channel) {
  if (channel.id !== "walkin") return channel.recentItems;
  return [...loadWalkinBookings(), ...channel.recentItems];
}

// ---------------------------------------------------------------------------
// Login gate
//
// NOTE: this is a front-end-only soft gate, not real security. This is a
// static page with no server, so these credentials live in the page's
// source and anyone who views it can read them or skip the check entirely.
// It keeps casual visitors out of day-to-day use; it does not protect
// sensitive data. Change the passwords below to your own.
// ---------------------------------------------------------------------------

const ACCOUNTS = {
  admin: { label: "Admin", password: "admin123" },
  owner: { label: "Owner", password: "owner123" },
};
const SESSION_KEY = "mrklin_session_v1";
let loginRole = "admin";

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; }
}
function saveSession(role) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ role }));
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

function setLoginRole(role) {
  loginRole = role;
  updateLoginRoleButtons();
}
function updateLoginRoleButtons() {
  const adminBtn = document.getElementById("role-btn-admin");
  const ownerBtn = document.getElementById("role-btn-owner");
  if (!adminBtn || !ownerBtn) return;
  adminBtn.className = `flex-1 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
    loginRole === "admin" ? "bg-brand-red text-ink" : "text-muted hover:text-brand-amber"
  }`;
  ownerBtn.className = `flex-1 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
    loginRole === "owner" ? "bg-brand-red text-ink" : "text-muted hover:text-brand-amber"
  }`;
}

function renderLogin() {
  document.getElementById("app-root").classList.add("hidden");
  const root = document.getElementById("login-root");
  root.innerHTML = `
    <div class="fixed inset-0 z-[100] flex items-center justify-center bg-base p-4">
      <div class="w-full max-w-sm rounded-2xl border border-white/10 bg-panel p-6 shadow-2xl shadow-black/50">
        <div class="mb-6 text-center">
          <p class="text-xs font-medium uppercase tracking-wide text-muted">MR. Klin Trading Services Corporation</p>
          <h1 class="mt-1 font-heading text-xl font-bold text-ink">Sign in</h1>
        </div>
        <form onsubmit="attemptLogin(event)" class="space-y-4">
          <div>
            <label class="mb-1 block text-xs font-medium text-muted">Role</label>
            <div class="flex rounded-lg bg-white/5 p-1">
              <button type="button" id="role-btn-admin" onclick="setLoginRole('admin')" class="flex-1 rounded-md px-3 py-1.5 text-sm font-medium transition-colors">Admin</button>
              <button type="button" id="role-btn-owner" onclick="setLoginRole('owner')" class="flex-1 rounded-md px-3 py-1.5 text-sm font-medium transition-colors">Owner</button>
            </div>
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-muted">Password</label>
            <input required id="login-password" type="password" autofocus
              class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:border-brand-amber focus:outline-none"
              placeholder="Enter password" />
          </div>
          <p id="login-error" class="hidden text-xs text-brand-red"></p>
          <button type="submit" class="w-full rounded-lg bg-brand-red px-4 py-2 text-sm font-medium text-ink hover:bg-brand-amber hover:text-base transition-colors">Sign in</button>
        </form>
      </div>
    </div>`;
  updateLoginRoleButtons();
}

function attemptLogin(event) {
  event.preventDefault();
  const password = document.getElementById("login-password").value;
  const account = ACCOUNTS[loginRole];
  const errorEl = document.getElementById("login-error");
  if (account && password === account.password) {
    saveSession(loginRole);
    startApp(loginRole);
  } else {
    errorEl.textContent = "Incorrect password. Please try again.";
    errorEl.classList.remove("hidden");
  }
}

function logout() {
  clearSession();
  loginRole = "admin";
  renderLogin();
}

function renderUserBadge(role) {
  const el = document.getElementById("user-badge");
  const account = ACCOUNTS[role];
  el.innerHTML = `
    <span class="text-xs text-muted">Signed in as</span>
    <span class="text-sm font-semibold text-ink">${account ? account.label : role}</span>
    <button onclick="logout()" class="ml-2 rounded-lg border border-white/10 px-2 py-1 text-xs font-medium text-muted transition-colors hover:border-brand-amber hover:text-brand-amber">Log out</button>`;
}

function startApp(role) {
  document.getElementById("login-root").innerHTML = "";
  document.getElementById("app-root").classList.remove("hidden");
  renderUserBadge(role);
  renderAll();
}

function bootstrap() {
  const session = loadSession();
  if (session && ACCOUNTS[session.role]) {
    startApp(session.role);
  } else {
    renderLogin();
  }
}

function renderKPIs() {
  const el = document.getElementById("kpi-header");
  el.innerHTML = KPIS.map((kpi) => {
    const value = scaleValue(kpi.base, kpi.flat);
    return `
      <div class="flex items-center gap-4 rounded-xl border border-white/10 bg-panel p-4">
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg ${kpi.ring}">
          <i data-lucide="${kpi.icon}" class="h-5 w-5 ${kpi.accent}"></i>
        </div>
        <div class="min-w-0">
          <p class="truncate text-sm text-muted">${kpi.label}</p>
          <p class="font-heading text-2xl font-bold text-ink tabular-nums">${fmt(value)}${kpi.unit}</p>
        </div>
      </div>`;
  }).join("");
}

function renderChannelMetric(metric) {
  const scaled = scaleValue(metric.value, !metric.scalable);
  return `${fmt(scaled)}${metric.unit}`;
}

            <div class="space-y-2">
              ${ch.metrics.map((m) => `

          </button>` : ""}
          <button onclick="openModal('${ch.id}')"
            class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-brand-red px-3 py-2 text-sm font-medium text-ink hover:bg-brand-amber hover:text-base transition-colors">
            View recent activity
            <i data-lucide="chevron-right" class="h-3.5 w-3.5"></i>
          </button>
        </div>
      </div>`;
  }).join("");
}

let modalState = { channelId: null, feature: null, status: "Overview" };

function renderModal() {
  const root = document.getElementById("modal-root");
  const { channelId, feature, status } = modalState;
  if (!channelId) { root.innerHTML = ""; return; }
  const ch = CHANNELS.find((c) => c.id === channelId);
  const items = getDisplayRecentItems(ch);
  const statuses = ["Overview", ...Array.from(new Set(items.map((i) => i.status)))];
  const filteredItems = status === "Overview" ? items : items.filter((i) => i.status === status);

  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/70 p-0 sm:items-center sm:p-4" onclick="closeModal()">
      <div class="flex max-h-[85vh] w-full flex-col overflow-hidden rounded-t-2xl border border-white/10 bg-panel shadow-2xl shadow-black/50 sm:max-w-2xl sm:rounded-2xl" onclick="event.stopPropagation()">
        <div class="flex items-center gap-3 px-5 py-4 bg-brand-red">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-white/15">
            <i data-lucide="${ch.icon}" class="h-5 w-5 text-ink"></i>
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate font-heading text-base font-bold text-ink">${ch.name}</p>
            <p class="truncate text-xs text-ink/80">${feature ? `Filtered by: ${feature}` : ch.recentLabel}</p>
          </div>
          <button onclick="closeModal()" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/15 text-ink hover:bg-white/25" aria-label="Close">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>
        <div class="flex flex-1 flex-col overflow-hidden sm:flex-row">
          <div class="flex shrink-0 gap-2 overflow-x-auto border-b border-white/10 p-3 sm:w-40 sm:flex-col sm:overflow-y-auto sm:border-b-0 sm:border-r sm:p-3">
            ${statuses.map((s) => {
              const count = s === "Overview" ? items.length : items.filter((i) => i.status === s).length;
              return `
              <button onclick="setModalStatusFilter('${s.replace(/'/g, "\\'")}')"
                class="flex shrink-0 items-center justify-between gap-2 rounded-lg px-3 py-2 text-left text-sm font-medium transition-colors ${
                  status === s ? "bg-brand-red text-ink" : "text-muted hover:bg-white/5 hover:text-brand-amber"
                }">
                <span class="truncate">${s}</span>
                <span class="shrink-0 text-[11px] opacity-75">${count}</span>
              </button>`;
            }).join("")}
          </div>
          <div class="flex-1 overflow-y-auto p-5">
            <div class="mb-4 grid grid-cols-3 gap-2">
              ${ch.metrics.map((m) => `
                <div class="rounded-lg bg-white/5 p-2.5 text-center">
                  <p class="text-sm font-semibold text-brand-amber">${fmt(m.value)}${typeof m.value === "number" ? m.unit : ""}</p>
                  <p class="mt-0.5 text-[11px] leading-tight text-muted">${m.label}</p>
                </div>`).join("")}
            </div>
            <p class="mb-2 text-xs font-medium text-muted">${ch.recentLabel}${status !== "Overview" ? ` — ${status}` : ""}</p>
            <ul class="space-y-2">
              ${filteredItems.length ? filteredItems.map((item) => `
                <li class="flex items-start gap-3 rounded-lg border border-white/10 p-3 hover:border-white/20">
                  <i data-lucide="file-text" class="mt-0.5 h-4 w-4 shrink-0 text-brand-amber"></i>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-start justify-between gap-2">
                      <p class="text-sm font-medium text-ink">${item.title}</p>
                      <span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-medium ${STATUS_STYLES[item.status] || "bg-white/10 text-muted"}">${item.status}</span>
                    </div>
                    <p class="mt-0.5 text-xs text-muted">${item.sub}</p>
                    <div class="mt-1 flex items-center gap-1 text-[11px] text-muted">
                      <i data-lucide="clock" class="h-3 w-3"></i>
                      ${item.time}
                    </div>
                  </div>
                </li>`).join("") : `<li class="rounded-lg border border-white/10 p-4 text-center text-sm text-muted">No items with this status.</li>`}
            </ul>
          </div>
        </div>
      </div>
    </div>`;
  lucide.createIcons();
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------

function setTimeframe(id) {
  state.timeframe = id;
  renderAll();
}
function setServiceType(id) {
  state.serviceType = id;
  renderAll();
}
function openModal(channelId, feature) {
  modalState = { channelId, feature: feature || null, status: "Overview" };
  renderModal();
}
function closeModal() {
  modalState = { channelId: null, feature: null, status: "Overview" };
  renderModal();
}
function setModalStatusFilter(status) {
  modalState.status = status;
  renderModal();
}

function openBookingForm() {
  const channel = CHANNELS.find((c) => c.id === "walkin");
  const root = document.getElementById("booking-modal-root");
  root.innerHTML = `
    <div class="fixed inset-0 z-[60] flex items-end justify-center bg-black/70 p-0 sm:items-center sm:p-4" onclick="closeBookingForm()">
      <div class="flex max-h-[90vh] w-full flex-col overflow-hidden rounded-t-2xl border border-white/10 bg-panel shadow-2xl shadow-black/50 sm:max-w-lg sm:rounded-2xl" onclick="event.stopPropagation()">
        <div class="flex items-center gap-3 px-5 py-4 bg-brand-red">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-white/15">
            <i data-lucide="clipboard-list" class="h-5 w-5 text-ink"></i>
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate font-heading text-base font-bold text-ink">New Walk-In Booking</p>
            <p class="truncate text-xs text-ink/80">Owner, vehicle & visit details</p>
          </div>
          <button onclick="closeBookingForm()" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/15 text-ink hover:bg-white/25" aria-label="Close">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>
        <form id="booking-form" class="flex-1 space-y-4 overflow-y-auto p-5" onsubmit="submitBooking(event)">
          <div>
            <label class="mb-1 block text-xs font-medium text-muted">Owner name *</label>
            <input required id="bf-owner" type="text" oninput="previewVisit()"
              class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:border-brand-amber focus:outline-none"
              placeholder="e.g. Maria Santos" />
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-muted">Phone number *</label>
            <input required id="bf-phone" type="tel" oninput="previewVisit()"
              class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:border-brand-amber focus:outline-none"
              placeholder="09xx xxx xxxx" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="mb-1 block text-xs font-medium text-muted">Vehicle make/model *</label>
              <input required id="bf-vehicle" type="text"
                class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:border-brand-amber focus:outline-none"
                placeholder="e.g. Toyota Vios" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-muted">Plate number</label>
              <input id="bf-plate" type="text"
                class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:border-brand-amber focus:outline-none"
                placeholder="ABC 1234" />
            </div>
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-muted">Service</label>
            <select id="bf-service" style="background-color:#1A1B1E; color:#F5F5F3;"
              class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-ink focus:border-brand-amber focus:outline-none">
              ${channel.features.map((f) => `<option value="${f}" style="background-color:#1A1B1E; color:#F5F5F3;">${f}</option>`).join("")}
            </select>
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-muted">Notes</label>
            <textarea id="bf-notes" rows="2"
              class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-ink placeholder:text-muted/60 focus:border-brand-amber focus:outline-none"
              placeholder="Optional notes"></textarea>
          </div>
          <div id="bf-visit-preview" class="rounded-lg bg-white/5 p-3 text-xs text-muted"></div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeBookingForm()" class="rounded-lg px-3 py-2 text-sm font-medium text-muted hover:text-ink">Cancel</button>
            <button type="submit" class="rounded-lg bg-brand-red px-4 py-2 text-sm font-medium text-ink hover:bg-brand-amber hover:text-base transition-colors">Save booking</button>
          </div>
        </form>
      </div>
    </div>`;
  lucide.createIcons();
}

function closeBookingForm() {
  document.getElementById("booking-modal-root").innerHTML = "";
}

function previewVisit() {
  const preview = document.getElementById("bf-visit-preview");
  const name = document.getElementById("bf-owner").value;
  const phone = document.getElementById("bf-phone").value;
  const key = getCustomerKey(name, phone);
  if (!key) { preview.textContent = ""; return; }
  const existing = loadCustomers()[key];
  preview.textContent = existing
    ? `Returning customer — this will be visit #${existing.visits + 1}. Last visit: ${existing.lastVisit}.`
    : "New customer — this will be their first visit.";
}

function submitBooking(event) {
  event.preventDefault();
  const ownerName = document.getElementById("bf-owner").value.trim();
  const phone = document.getElementById("bf-phone").value.trim();
  const vehicle = document.getElementById("bf-vehicle").value.trim();
  const plate = document.getElementById("bf-plate").value.trim();
  const service = document.getElementById("bf-service").value;
  const notes = document.getElementById("bf-notes").value.trim();

  const key = getCustomerKey(ownerName, phone);
  const customers = loadCustomers();
  const visitNumber = customers[key] ? customers[key].visits + 1 : 1;
  customers[key] = { name: ownerName, phone, visits: visitNumber, lastVisit: "Today" };
  saveCustomers(customers);

  const visitLabel = visitNumber === 1 ? "1st visit" : `Visit #${visitNumber}`;
  const bookings = loadWalkinBookings();
  bookings.unshift({
    title: `Walk-in — ${service}`,
    sub: `${vehicle}${plate ? " · Plate " + plate : ""} · Owner: ${ownerName} · ${visitLabel}${notes ? " · " + notes : ""}`,
    status: "Booked",
    time: "Just now",
  });
  saveWalkinBookings(bookings);

  closeBookingForm();
  renderAll();
  openModal("walkin");
}

function renderAll() {
  renderKPIs();
  renderFilterBar();
  renderChannels();
  lucide.createIcons();
}

bootstrap();
</script>
</body>
