     markup. `line` stands in for the raw white/NN overlays borders and
     hover states used before light mode existed — white-based in dark

// Sidebar UI state — desktop collapse persists across sessions, the mobile
// drawer's open/closed state is session-only and lives outside `state` so it
// isn't reset by every renderAll() triggered from filters/section changes.
const SIDEBAR_COLLAPSED_KEY = "mrklin_sidebar_collapsed_v1";
let sidebarCollapsed = localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "1";
let mobileSidebarOpen = false;

// Theme state — the inline script in <head> already set data-theme before
// this script ran (avoids a flash of the wrong theme), so this just reads
// that same attribute back rather than re-deciding it.
const THEME_KEY = "mrklin_theme_v1";
let currentTheme = document.documentElement.getAttribute("data-theme") || "dark";

function applyTheme() {
  document.documentElement.setAttribute("data-theme", currentTheme);
  try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}
}
function toggleTheme() {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  applyTheme();
  renderThemeToggle();
}
function renderThemeToggle() {
  const el = document.getElementById("theme-toggle");
  if (!el) return;
  const isDark = currentTheme === "dark";
  el.innerHTML = `<i data-lucide="${isDark ? "moon" : "sun"}" class="h-4 w-4"></i>`;
  el.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
  el.title = isDark ? "Light mode" : "Dark mode";
  lucide.createIcons();
}

function toggleSidebarCollapse() {
  sidebarCollapsed = !sidebarCollapsed;
  localStorage.setItem(SIDEBAR_COLLAPSED_KEY, sidebarCollapsed ? "1" : "0");
  renderSidebar();
}
function openMobileSidebar() {
  mobileSidebarOpen = true;
  applySidebarOpenState();
}
function closeMobileSidebar() {
  mobileSidebarOpen = false;
  applySidebarOpenState();
}
function applySidebarOpenState() {
  const overlay = document.getElementById("sidebar-overlay");
  const sidebar = document.getElementById("sidebar");
  if (overlay) overlay.classList.toggle("hidden", !mobileSidebarOpen);
  if (sidebar) sidebar.classList.toggle("-translate-x-full", !mobileSidebarOpen);
  if (sidebar) sidebar.classList.toggle("translate-x-0", mobileSidebarOpen);
}
function handleChannelNavClick(channelId) {
  closeMobileSidebar();
  openModal(channelId);
}
function handleSectionNavClick(sectionId) {
  closeMobileSidebar();
  setSection(sectionId);
}

function getFactor() {
  return TIMEFRAMES.find((t) => t.id === state.timeframe).factor;
}
function scaleValue(value, flat) {
  const factor = getFactor();
  if (flat || typeof value !== "number") return value;
  return Math.round(value * factor);
}
function fmt(n) {
  return typeof n === "number" ? n.toLocaleString("en-US") : n;
}

// Walk-in bookings and customer visit counts live in localStorage since this
// dashboard has no backend — they persist on this browser/device only.
const CUSTOMERS_KEY = "mrklin_customers_v1";
const WALKIN_BOOKINGS_KEY = "mrklin_walkin_bookings_v1";

function loadCustomers() {
  try { return JSON.parse(localStorage.getItem(CUSTOMERS_KEY)) || {}; } catch { return {}; }
}
function saveCustomers(customers) {
  localStorage.setItem(CUSTOMERS_KEY, JSON.stringify(customers));
}
function loadWalkinBookings() {
  let bookings;
  try { bookings = JSON.parse(localStorage.getItem(WALKIN_BOOKINGS_KEY)) || []; } catch { bookings = []; }
  let needsBackfill = false;
  bookings.forEach((b, i) => {
    if (!b.id) { b.id = `wb-${Date.now()}-${i}`; needsBackfill = true; }
  });
  if (needsBackfill) saveWalkinBookings(bookings);
  return bookings;
}
function saveWalkinBookings(bookings) {
  localStorage.setItem(WALKIN_BOOKINGS_KEY, JSON.stringify(bookings));
}
function normalizePhone(phone) {
  return (phone || "").replace(/\D/g, "");
}
function getCustomerKey(name, phone) {
  return normalizePhone(phone) || (name || "").trim().toLowerCase();
}
function getDisplayRecentItems(channel) {
  if (channel.id !== "walkin") return channel.recentItems;
  return [...loadWalkinBookings(), ...channel.recentItems];
}

  localStorage.setItem(SESSION_KEY, JSON.stringify({ role }));
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

function setLoginRole(role) {
  loginRole = role;
  updateLoginRoleButtons();
}
function updateLoginRoleButtons() {
  Object.keys(ACCOUNTS).forEach((role) => {

    btn.className = `flex-1 rounded-md px-2 py-1.5 text-xs font-medium transition-colors sm:px-3 sm:text-sm ${

}

function attemptLogin(event) {
  event.preventDefault();
  const password = document.getElementById("login-password").value;
  const account = ACCOUNTS[loginRole];
  const errorEl = document.getElementById("login-error");
  if (account && password === account.password) {
    saveSession(loginRole);
    startApp(loginRole);
  } else {
    errorEl.textContent = "Incorrect password. Please try again.";
    errorEl.classList.remove("hidden");
  }
}

function logout() {
  clearSession();
  loginRole = "admin";
  renderLogin();
}

function markWalkinDone(id) {
  const bookings = loadWalkinBookings();
  const booking = bookings.find((b) => b.id === id);
  if (!booking) return;
  booking.status = "Completed";
  saveWalkinBookings(bookings);
  renderEmployeeView(loadSession().role);
}

function bootstrap() {
  const session = loadSession();
  if (session && ACCOUNTS[session.role]) {
    startApp(session.role);
  } else {
    renderLogin();

let modalState = { channelId: null, feature: null, status: "Overview" };

function renderModal() {
  const root = document.getElementById("modal-root");
  const { channelId, feature, status } = modalState;
  if (!channelId) { root.innerHTML = ""; return; }
  const ch = CHANNELS.find((c) => c.id === channelId);
  const items = getDisplayRecentItems(ch);
  const statuses = ["Overview", ...Array.from(new Set(items.map((i) => i.status)))];
  const filteredItems = status === "Overview" ? items : items.filter((i) => i.status === status);

  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/70 p-0 sm:items-center sm:p-4" onclick="closeModal()">
      <div class="flex max-h-[85vh] w-full flex-col overflow-hidden rounded-t-2xl border border-line/10 bg-panel shadow-2xl shadow-black/50 sm:max-w-2xl sm:rounded-2xl" onclick="event.stopPropagation()">

          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/15">
            <i data-lucide="${ch.icon}" class="h-5 w-5 text-white"></i>
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate font-heading text-base font-bold text-white">${ch.name}</p>
            <p class="truncate text-xs text-white/80">${feature ? `Filtered by: ${feature}` : ch.recentLabel}</p>
          </div>
          <button onclick="closeModal()" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/15 text-white transition-colors hover:bg-white/25" aria-label="Close">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>
        <div class="flex flex-1 flex-col overflow-hidden sm:flex-row">
          <div class="flex shrink-0 gap-2 overflow-x-auto border-b border-line/10 p-3 sm:w-40 sm:flex-col sm:overflow-y-auto sm:border-b-0 sm:border-r sm:p-3">
            ${statuses.map((s) => {
              const count = s === "Overview" ? items.length : items.filter((i) => i.status === s).length;
              return `
              <button onclick="setModalStatusFilter('${s.replace(/'/g, "\\'")}')"
                class="flex shrink-0 items-center justify-between gap-2 rounded-lg px-3 py-2 text-left text-sm font-medium transition-colors ${
                  status === s ? "bg-brand-red text-white" : "text-muted hover:bg-line/5 hover:text-brand-amber"
                }">
                <span class="truncate">${s}</span>
                <span class="shrink-0 text-[11px] opacity-75">${count}</span>
              </button>`;
            }).join("")}
          </div>
          <div class="flex-1 overflow-y-auto p-5">
            <div class="mb-4 grid grid-cols-3 gap-2">
              ${ch.metrics.map((m) => `
                <div class="rounded-xl bg-line/5 p-2.5 text-center">
                  <p class="text-sm font-semibold text-brand-amber">${fmt(m.value)}${typeof m.value === "number" ? m.unit : ""}</p>
                  <p class="mt-0.5 text-[11px] leading-tight text-muted">${m.label}</p>
                </div>`).join("")}
            </div>
            <p class="mb-2 text-xs font-medium uppercase tracking-wide text-muted">${ch.recentLabel}${status !== "Overview" ? ` — ${status}` : ""}</p>
            <ul class="space-y-2">
              ${filteredItems.length ? filteredItems.map((item) => `
                <li class="flex items-start gap-3 rounded-xl border border-line/10 p-3 transition-colors hover:border-line/20">
                  <i data-lucide="file-text" class="mt-0.5 h-4 w-4 shrink-0 text-brand-amber"></i>
                  <div class="min-w-0 flex-1">

                      <span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-medium ${STATUS_STYLES[item.status] || "bg-line/10 text-muted"}">${item.status}</span>

            </ul>
          </div>
        </div>
      </div>
    </div>`;
  lucide.createIcons();
}

function previewVisit() {
  const preview = document.getElementById("bf-visit-preview");
  const name = document.getElementById("bf-owner").value;
  const phone = document.getElementById("bf-phone").value;
  const key = getCustomerKey(name, phone);
  if (!key) { preview.textContent = ""; return; }
  const existing = loadCustomers()[key];
  preview.textContent = existing
    ? `Returning customer — this will be visit #${existing.visits + 1}. Last visit: ${existing.lastVisit}.`
    : "New customer — this will be their first visit.";
}

function submitBooking(event) {
  event.preventDefault();
  const ownerName = document.getElementById("bf-owner").value.trim();
  const phone = document.getElementById("bf-phone").value.trim();
  const vehicle = document.getElementById("bf-vehicle").value.trim();
  const plate = document.getElementById("bf-plate").value.trim();
  const service = document.getElementById("bf-service").value;
  const notes = document.getElementById("bf-notes").value.trim();

  const key = getCustomerKey(ownerName, phone);
  const customers = loadCustomers();
  const visitNumber = customers[key] ? customers[key].visits + 1 : 1;
  customers[key] = { name: ownerName, phone, visits: visitNumber, lastVisit: "Today" };
  saveCustomers(customers);

  const visitLabel = visitNumber === 1 ? "1st visit" : `Visit #${visitNumber}`;
  const bookings = loadWalkinBookings();
  bookings.unshift({
    id: `wb-${Date.now()}`,
    title: `Walk-in — ${service}`,
    sub: `${vehicle}${plate ? " · Plate " + plate : ""} · Owner: ${ownerName} · ${visitLabel}${notes ? " · " + notes : ""}`,
    status: "Booked",
    time: "Just now",
    ownerName,
    phone,
    vehicle,
    plate,
    service,
    visitNumber,
  });
  saveWalkinBookings(bookings);

  closeBookingForm();
  renderAll();
  openModal("walkin");
}

function countNewItems() {
  return CHANNELS.reduce((sum, ch) => sum + getDisplayRecentItems(ch).filter((i) => i.status === "New").length, 0);
}

// Builds the Overview "Needs your attention" list: one row per channel+status
// combo that has at least one item in an ATTENTION_STATUSES bucket, ranked by
// urgency then by how many items are waiting.
function buildAttentionItems() {
  const rows = [];
  CHANNELS.forEach((ch) => {
    const items = getDisplayRecentItems(ch);
    ATTENTION_STATUSES.forEach((status) => {
      const count = items.filter((i) => i.status === status).length;
      if (count > 0) rows.push({ channelId: ch.id, channelName: ch.name, status, count });
    });
  });
  rows.sort((a, b) => {
    const rank = ATTENTION_STATUSES.indexOf(a.status) - ATTENTION_STATUSES.indexOf(b.status);
    return rank !== 0 ? rank : b.count - a.count;
  });
  return rows.slice(0, 5);
}

function renderRevenueByChannel() {
  const paid = paidTransactions();
  const total = paid.reduce((s, t) => s + t.amount, 0) || 1;
  const rows = CHANNELS.map((ch) => {

    return { ch, amount, pct: Math.round((amount / total) * 100) };
  }).filter((r) => r.amount > 0).sort((a, b) => b.amount - a.amount);

  if (!rows.length) return `<p class="rounded-xl border border-line/10 bg-line/5 p-4 text-center text-sm text-muted">No paid transactions yet.</p>`;
  return `<ul class="space-y-3">` + rows.map((r) => `

  el.innerHTML = filtered.length
    ? filtered.map(renderChannelCard).join("")
    : `<div class="col-span-full rounded-xl border border-line/10 bg-panel p-6 text-center text-sm text-muted">No channels for this service type.</div>`;
}

function renderServicesSection() {
  const root = document.getElementById("section-root");
  root.innerHTML = `
    <div>
      <p class="font-heading text-xl font-bold text-ink">Services</p>
      <p class="mt-1 text-sm text-muted">Browse channels by service type — Mobile detailing on the road, or In-Shop appointments at the counter.</p>
      <div id="services-type-cards" class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-3"></div>
    </div>
    <div id="services-channels-grid" class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3"></div>`;
  renderServiceTypeCards();
  renderServiceChannelsGrid();
}

function renderAll() {
  renderSidebar();
  renderHeaderRolePill(currentRole, "user-badge");
  renderThemeToggle();
  if (state.section === "services") {
    renderServicesSection();
  } else if (state.section === "financials") {
    renderFinancialsSection();
  } else {
    renderOverviewSection();
  }
  lucide.createIcons();
}

bootstrap();
</script>
</body>
</html>
